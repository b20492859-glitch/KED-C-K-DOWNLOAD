<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kedicik Hub | İndir</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#0f0f0f,#1b1b1b,#000000);
color:white;
overflow:hidden;
}

.card{

backdrop-filter:blur(15px);
background:rgba(20,20,20,0.7);
border:1px solid rgba(255,0,0,0.4);
padding:50px;
border-radius:20px;
text-align:center;
width:420px;
box-shadow:0 0 40px rgba(255,0,0,0.3);

animation:fadeIn 1.2s ease;
}

.logo{

font-size:40px;
margin-bottom:10px;
}

h1{
font-size:32px;
font-weight:700;
margin-bottom:10px;
letter-spacing:1px;
}

p{
font-size:15px;
color:#cfcfcf;
margin-bottom:30px;
}

.btn{

display:inline-block;
padding:16px 40px;
background:linear-gradient(90deg,#ff0000,#ff3c3c);
color:white;
text-decoration:none;
font-weight:600;
border-radius:8px;
transition:0.3s;
box-shadow:0 0 20px rgba(255,0,0,0.6);
}

.btn:hover{

transform:scale(1.07);
box-shadow:0 0 35px rgba(255,0,0,1);
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

footer{

position:absolute;
bottom:20px;
font-size:13px;
color:#888;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">🐱</div>

<h1>KEDİCİK HUB</h1>

<p>En güncel ve güvenli sürümü indirmek için aşağıdaki butona tıklayın.</p>

<a href="https://link-hub.net/4256129/Z8eSmLJfpaOj" class="btn">
HEMEN İNDİR
</a>

</div>

<footer>
© 2026 Kedicik Hub
</footer>

</body>
</html>
